  <!-- Lean angle guide at 8.1° (1px/7px). Scale 1.5×, translate (10,10). -->
  <!-- Bars span x=59..141, y=58..99 in 200×160. At 1.5×: x=88.5..211.5, y=87..148.5 + translate(10,10) = 98.5..221.5, 97..158.5 -->
  <line x1="89" y1="230" x2="122" y2="82" stroke="#4a90d9" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
