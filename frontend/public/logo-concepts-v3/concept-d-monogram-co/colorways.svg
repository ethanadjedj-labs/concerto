  <text x="192" y="354" font-family="monospace" font-size="7" fill="#9b9490">Peach / Warm</text>

  <!-- R3C3: Peach on black -->
  <g transform="translate(412,258) scale(0.4)">
    <path d="M 135.7 67.0 A 62 62 0 1 0 125.8 141.8 L 118.8 129.8 A 45 45 0 1 1 126.0 75.5 Z" fill="#cc785c"/>
    <path d="M 150 67 A 22 25 0 0 1 150 117 A 22 25 0 0 1 150 67 Z M 150 76 A 13 16 0 0 0 150 108 A 13 16 0 0 0 150 76 Z" fill="#cc785c" fill-rule="evenodd"/>
  </g>
  <text x="372" y="354" font-family="monospace" font-size="7" fill="#6b6560">Peach / Black</text>

  <text x="6" y="11" font-family="monospace" font-size="7" fill="#2a2925">D — Monogram Co · Colorways</text>
</svg>
