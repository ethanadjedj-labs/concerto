    <path d="M 150 67 A 22 25 0 0 1 150 117 A 22 25 0 0 1 150 67 Z M 150 76 A 13 16 0 0 0 150 108 A 13 16 0 0 0 150 76 Z" fill="#cc785c" fill-rule="evenodd"/>
