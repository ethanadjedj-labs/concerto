<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Concept D construction grid">
  <title>Concept D — Construction grid</title>

  <rect width="300" height="300" fill="#faf9f5"/>

  <!-- Grid: 10px -->
  <g stroke="#e8e4dc" stroke-width="0.5" opacity="0.7">
    <line x1="0" y1="30" x2="300" y2="30"/><line x1="0" y1="40" x2="300" y2="40"/>
    <line x1="0" y1="50" x2="300" y2="50"/><line x1="0" y1="60" x2="300" y2="60"/>
    <line x1="0" y1="70" x2="300" y2="70"/><line x1="0" y1="80" x2="300" y2="80"/>
    <line x1="0" y1="90" x2="300" y2="90"/><line x1="0" y1="100" x2="300" y2="100"/>
    <line x1="0" y1="110" x2="300" y2="110"/><line x1="0" y1="120" x2="300" y2="120"/>
    <line x1="0" y1="130" x2="300" y2="130"/><line x1="0" y1="140" x2="300" y2="140"/>
    <line x1="0" y1="150" x2="300" y2="150"/><line x1="0" y1="160" x2="300" y2="160"/>
    <line x1="0" y1="170" x2="300" y2="170"/><line x1="0" y1="180" x2="300" y2="180"/>
    <line x1="0" y1="190" x2="300" y2="190"/><line x1="0" y1="200" x2="300" y2="200"/>
    <line x1="0" y1="210" x2="300" y2="210"/><line x1="0" y1="220" x2="300" y2="220"/>
    <line x1="0" y1="230" x2="300" y2="230"/><line x1="0" y1="240" x2="300" y2="240"/>
    <line x1="0" y1="250" x2="300" y2="250"/>
    <line x1="20" y1="0" x2="20" y2="300"/><line x1="30" y1="0" x2="30" y2="300"/>
    <line x1="40" y1="0" x2="40" y2="300"/><line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="60" y1="0" x2="60" y2="300"/><line x1="70" y1="0" x2="70" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/><line x1="90" y1="0" x2="90" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="110" y1="0" x2="110" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/><line x1="130" y1="0" x2="130" y2="300"/>
    <line x1="140" y1="0" x2="140" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/><line x1="170" y1="0" x2="170" y2="300"/>
    <line x1="180" y1="0" x2="180" y2="300"/><line x1="190" y1="0" x2="190" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/><line x1="210" y1="0" x2="210" y2="300"/>
    <line x1="220" y1="0" x2="220" y2="300"/><line x1="230" y1="0" x2="230" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="260" y1="0" x2="260" y2="300"/><line x1="270" y1="0" x2="270" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
  </g>

  <!-- Construction circles (scaled 1.25× at translate 25,25) -->
  <!-- C outer: center (82*1.25+25, 98*1.25+25)=(127.5,147.5), r=62*1.25=77.5 -->
  <!-- C inner: center (87*1.25+25, 98*1.25+25)=(133.75,147.5), r=45*1.25=56.25 -->
  <!-- o outer: ellipse center (150*1.25+25, 92*1.25+25)=(212.5,140), rx=27.5,ry=31.25 -->
  <!-- o inner: center same, rx=16.25,ry=20 -->

  <!-- C outer circle -->
  <circle cx="127.5" cy="147.5" r="77.5" fill="none" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- C inner eccentric circle -->
  <circle cx="133.75" cy="147.5" r="56.25" fill="none" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="2,3"/>
  <!-- Center marks -->
  <circle cx="127.5" cy="147.5" r="2" fill="#b8b0a4"/>
  <circle cx="133.75" cy="147.5" r="2" fill="#cc785c" opacity="0.5"/>

  <!-- o outer ellipse -->
  <ellipse cx="212.5" cy="140" rx="27.5" ry="31.25" fill="none" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- o inner ellipse -->
  <ellipse cx="212.5" cy="140" rx="16.25" ry="20" fill="none" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="2,3"/>
  <circle cx="212.5" cy="140" r="2" fill="#b8b0a4"/>

  <!-- Shared top tangent line (y = 67*1.25+25 = 108.75) -->
  <line x1="60" y1="108.75" x2="250" y2="108.75" stroke="#cc785c" stroke-width="0.8" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="252" y="111" font-family="monospace" font-size="7" fill="#cc785c" opacity="0.8">shared top</text>

  <!-- Opening angles: -30° upper, +45° lower from C center -->
  <!-- Upper terminal line: from C center (127.5,147.5) to (127.5+77.5*cos30°, 147.5-77.5*sin30°) -->
  <!-- = (127.5+67.1, 147.5-38.75) = (194.6, 108.75) -->
  <line x1="127.5" y1="147.5" x2="194.6" y2="108.75" stroke="#cc785c" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- Lower terminal: (127.5+77.5*cos45°, 147.5+77.5*sin45°) = (127.5+54.8,147.5+54.8)=(182.3,202.3) -->
  <line x1="127.5" y1="147.5" x2="182.3" y2="202.3" stroke="#cc785c" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Opening angle arc -->
  <path d="M 185 120 A 65 65 0 0 1 165 195" fill="none" stroke="#cc785c" stroke-width="0.6" opacity="0.35"/>
  <text x="188" y="156" font-family="monospace" font-size="7" fill="#cc785c" opacity="0.6">75°</text>

  <!-- Mark at 1.25× scale -->
  <g transform="translate(25,25) scale(1.25)">
    <path
      d="M 135.7 67.0 A 62 62 0 1 0 125.8 141.8 L 118.8 129.8 A 45 45 0 1 1 126.0 75.5 Z"
      fill="#cc785c" opacity="0.82"
    />
    <path
      d="M 150 67 A 22 25 0 0 1 150 117 A 22 25 0 0 1 150 67 Z M 150 76 A 13 16 0 0 0 150 108 A 13 16 0 0 0 150 76 Z"
      fill="#cc785c" opacity="0.82" fill-rule="evenodd"
    />
  </g>

  <text x="6" y="14" font-family="monospace" font-size="8" fill="#2a2925">D — Monogram Co · Construction Grid</text>
  <text x="6" y="292" font-family="monospace" font-size="7" fill="#9b9490">C outer r=62 / inner r=45 (Δcx=+5) / opening −30°→+45° / o top y=67 aligned</text>
</svg>
