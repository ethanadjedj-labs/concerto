<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Concept C construction grid">
  <title>Concept C — Construction grid</title>
  <rect width="300" height="300" fill="#faf9f5"/>
  <g stroke="#e8e4dc" stroke-width="0.5" opacity="0.7">
    <line x1="0" y1="50" x2="300" y2="50"/><line x1="0" y1="70" x2="300" y2="70"/>
    <line x1="0" y1="90" x2="300" y2="90"/><line x1="0" y1="110" x2="300" y2="110"/>
    <line x1="0" y1="130" x2="300" y2="130"/><line x1="0" y1="150" x2="300" y2="150"/>
    <line x1="0" y1="170" x2="300" y2="170"/><line x1="0" y1="190" x2="300" y2="190"/>
    <line x1="0" y1="210" x2="300" y2="210"/><line x1="0" y1="230" x2="300" y2="230"/>
    <line x1="0" y1="250" x2="300" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/><line x1="70" y1="0" x2="70" y2="300"/>
    <line x1="90" y1="0" x2="90" y2="300"/><line x1="110" y1="0" x2="110" y2="300"/>
    <line x1="130" y1="0" x2="130" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="170" y1="0" x2="170" y2="300"/><line x1="190" y1="0" x2="190" y2="300"/>
    <line x1="210" y1="0" x2="210" y2="300"/><line x1="230" y1="0" x2="230" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
  </g>
  <!-- Mark scaled 1.3×, offset (20,20). Mark center (100,100)→(130+20, 130+20)=(150,150). -->
  <!-- Arm axis lines extended -->
  <line x1="108" y1="66" x2="72" y2="150" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="192" y1="66" x2="228" y2="150" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="5,3" opacity="0.6"/>
  <!-- Horizontal center -->
  <line x1="20" y1="150" x2="280" y2="150" stroke="#c8c2b8" stroke-width="0.6" stroke-dasharray="6,3" opacity="0.5"/>
  <!-- Golden ratio line: y = 85*1.3+20 = 130.5 -->
  <line x1="30" y1="130.5" x2="270" y2="130.5" stroke="#cc785c" stroke-width="0.6" stroke-dasharray="3,4" opacity="0.4"/>
  <text x="240" y="128" font-family="monospace" font-size="8" fill="#cc785c" opacity="0.7">φ</text>
  <!-- Weight indicators -->
  <rect x="18" y="168" width="13" height="3" fill="#4a90d9" opacity="0.4"/>
  <text x="18" y="165" font-family="monospace" font-size="7" fill="#4a90d9" opacity="0.7">10px arm</text>
  <rect x="18" y="178" width="7.8" height="2" fill="#4a90d9" opacity="0.4"/>
  <text x="18" y="175" font-family="monospace" font-size="7" fill="#4a90d9" opacity="0.7">6px arm</text>
  <!-- Mark at 1.3× -->
  <g transform="translate(20,20) scale(1.3)">
    <path d="M 68 35 L 40 100 L 68 165 L 77.2 161.0 L 49.2 104.0 L 77.2 39.0 Z" fill="#cc785c" opacity="0.85"/>
    <rect x="46" y="29" width="36" height="7" fill="#cc785c" opacity="0.85"/>
    <rect x="46" y="164" width="36" height="7" fill="#cc785c" opacity="0.85"/>
    <path d="M 132 35 L 160 100 L 132 165 L 126.5 162.6 L 154.5 102.4 L 126.5 37.4 Z" fill="#cc785c" opacity="0.85"/>
    <rect x="118" y="29" width="36" height="4" fill="#cc785c" opacity="0.85"/>
    <rect x="118" y="167" width="36" height="4" fill="#cc785c" opacity="0.85"/>
    <circle cx="100" cy="85" r="4.5" fill="#cc785c" opacity="0.85"/>
  </g>
  <text x="6" y="14" font-family="monospace" font-size="8" fill="#2a2925">C — Workshop Bracket · Construction Grid</text>
  <text x="6" y="292" font-family="monospace" font-size="7" fill="#9b9490">left arm 10px / right arm 6px / crossbars 7+4px / dot at φ=38.2% from top</text>
</svg>
