<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Concept A construction grid">
  <title>Concept A — Construction grid</title>
  <rect width="300" height="300" fill="#faf9f5"/>
  <g stroke="#e8e4dc" stroke-width="0.5" opacity="0.7">
    <line x1="30" y1="0" x2="30" y2="300"/><line x1="60" y1="0" x2="60" y2="300"/>
    <line x1="90" y1="0" x2="90" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/><line x1="180" y1="0" x2="180" y2="300"/>
    <line x1="210" y1="0" x2="210" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="270" y1="0" x2="270" y2="300"/>
    <line x1="0" y1="30" x2="300" y2="30"/><line x1="0" y1="60" x2="300" y2="60"/>
    <line x1="0" y1="90" x2="300" y2="90"/><line x1="0" y1="120" x2="300" y2="120"/>
    <line x1="0" y1="150" x2="300" y2="150"/><line x1="0" y1="180" x2="300" y2="180"/>
    <line x1="0" y1="210" x2="300" y2="210"/><line x1="0" y1="240" x2="300" y2="240"/>
    <line x1="0" y1="270" x2="300" y2="270"/>
  </g>
  <!-- Construction: mark scaled 1.5× at (30,30). Center at (180,180). -->
  <!-- Outer circle: r=105, center (180,180) -->
  <circle cx="180" cy="180" r="105" fill="none" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Inner eccentric: r=79.5, center (187.5,180) -->
  <circle cx="187.5" cy="180" r="79.5" fill="none" stroke="#b8b0a4" stroke-width="0.8" stroke-dasharray="2,3"/>
  <circle cx="180" cy="180" r="2.5" fill="#b8b0a4"/>
  <circle cx="187.5" cy="180" r="2.5" fill="#cc785c" opacity="0.5"/>
  <!-- Center axes -->
  <line x1="30" y1="180" x2="290" y2="180" stroke="#c8c2b8" stroke-width="0.6" stroke-dasharray="6,3"/>
  <line x1="180" y1="30" x2="180" y2="290" stroke="#c8c2b8" stroke-width="0.6" stroke-dasharray="6,3"/>
  <!-- Opening angle lines ±35° from horizontal right -->
  <!-- Upper: cos35=0.819, sin35=0.574 → (180+0.819*120, 180-0.574*120)=(278,111) -->
  <line x1="180" y1="180" x2="278" y2="111" stroke="#cc785c" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="180" y1="180" x2="278" y2="249" stroke="#cc785c" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- Stroke thickness: left (heavy 18px) -->
  <line x1="75" y1="180" x2="108.5" y2="180" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <text x="70" y="176" font-family="monospace" font-size="7" fill="#4a90d9">18px</text>
  <!-- Stroke: right (lighter 12px at 0°) -->
  <line x1="252" y1="180" x2="264" y2="180" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <text x="242" y="176" font-family="monospace" font-size="7" fill="#4a90d9">12px</text>
  <!-- Mark on top at 1.5× from (30,30) -->
  <g transform="translate(30,30) scale(1.5)">
    <path d="M 157.3 59.9 A 70 70 0 1 0 157.3 140.1 L 148.4 130.4 A 53 53 0 1 1 148.4 69.6 Z" fill="#cc785c" opacity="0.85"/>
    <rect x="148.4" y="140.1" width="21.0" height="3.5" fill="#cc785c" opacity="0.85"/>
  </g>
  <text x="246" y="126" font-family="monospace" font-size="7" fill="#cc785c" opacity="0.8">35°</text>
  <text x="246" y="240" font-family="monospace" font-size="7" fill="#cc785c" opacity="0.8">35°</text>
  <text x="6" y="14" font-family="monospace" font-size="8" fill="#2a2925">A — Typographic C · Construction Grid</text>
  <text x="6" y="292" font-family="monospace" font-size="7" fill="#9b9490">outer r=70 center(100,100) / inner r=53 center(105,100) / opening ±35°</text>
</svg>
