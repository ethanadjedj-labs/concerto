<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Concerto C-Serif lockup">
  <title>Concerto — C-Serif lockup</title>
  <defs>
    <mask id="c1lm">
      <rect width="100" height="100" fill="white"/>
      <circle cx="50" cy="50" r="28" fill="black"/>
      <polygon points="50,50 130,0 130,100" fill="black"/>
    </mask>
  </defs>
  <!-- Mark at 80×80 via nested SVG -->
  <svg x="0" y="0" width="80" height="80" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="43" fill="#cc785c" mask="url(#c1lm)"/>
  </svg>
  <!-- Wordmark -->
  <text x="96" y="56"
        font-family="Fraunces, 'Palatino Linotype', Georgia, serif"
        font-size="42"
        font-weight="500"
        fill="#191919"
        letter-spacing="-1">Concerto</text>
</svg>