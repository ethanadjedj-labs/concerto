<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Concerto favicon — bubble+baton, heavier strokes for small-size rendering
    Bubble stroke=6 (vs 4 in mark-only), Baton stroke=16 (vs 12), Dot r=10 (vs 9)
    Dark bg rounded square for legibility in browser tabs
  -->
  <rect width="128" height="128" rx="28" ry="28" fill="#1f1e1c"/>
  <defs>
    <clipPath id="bubble-clip-f">
      <path d="M 32,8 H 96 a 18,18 0 0 1 18,18 V 90 a 18,18 0 0 1 -18,18 H 32 L 7,115 L 14,90 V 26 a 18,18 0 0 1 18,-18 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bubble-clip-f)">
    <line x1="26" y1="96" x2="104" y2="18" stroke="#cc785c" stroke-width="16" stroke-linecap="butt"/>
    <circle cx="104" cy="18" r="10" fill="#cc785c"/>
  </g>
  <path d="M 32,8 H 96 a 18,18 0 0 1 18,18 V 90 a 18,18 0 0 1 -18,18 H 32 L 7,115 L 14,90 V 26 a 18,18 0 0 1 18,-18 Z"
    fill="none" stroke="#faf9f5" stroke-width="6" stroke-linejoin="round"/>
</svg>
