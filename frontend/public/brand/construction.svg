<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" width="280" height="400">
  <!--
    Concerto mark — construction grid
    All guide coordinates are 2× the canonical 128×128 mark coordinates,
    with an additional translate(24,24): point (x,y) → (24+2x, 24+2y)

    Square: x=24+28=52, y=24+16=40, side=200, r=36 (18×2)
    BL arc center: (24+64,24+180)=(88,204)
    TR arc center: (24+192,24+52)=(216,76)
    Baton: (24+52,24+192)=(76,216) → (24+208,24+36)=(232,60)
    Dot: center=(232,60), r=18 (9×2)
    Tail: V1=(24+64,24+216)=(88,240), tip=(24+14,24+230)=(38,254), V2=(24+28,24+180)=(52,204)
    Bubble center of square: (24+128,24+116)=(152,140)
  -->
  <!-- Cream background -->
  <rect width="280" height="400" fill="#faf9f5"/>

  <!-- ─── Construction guides (drawn first, below the icon) ─── -->
  <g stroke="#c0bdb8" fill="none" stroke-width="1">
    <!-- Square boundary -->
    <rect x="52" y="40" width="200" height="200" rx="36" ry="36" stroke-dasharray="5 4"/>

    <!-- Corner radius arcs — quarter-circle indicators at each corner -->
    <!-- TL: center (88,76) -->
    <path d="M 88,40 A 36,36 0 0 0 52,76" stroke-dasharray="3 3"/>
    <!-- TR: center (216,76) -->
    <path d="M 216,40 A 36,36 0 0 1 252,76" stroke-dasharray="3 3"/>
    <!-- BR: center (216,204) -->
    <path d="M 252,204 A 36,36 0 0 1 216,240" stroke-dasharray="3 3"/>
    <!-- BL → replaced by tail; show arc for reference -->
    <path d="M 88,240 A 36,36 0 0 1 52,204" stroke-dasharray="3 3" stroke="#d4b8a8" stroke-width="0.75"/>

    <!-- 45° baton centerline extended across full bubble -->
    <line x1="52" y1="240" x2="252" y2="40" stroke-dasharray="6 4"/>

    <!-- Baton segment highlight -->
    <line x1="76" y1="216" x2="232" y2="60" stroke="#cc785c" stroke-opacity="0.3" stroke-width="2.5"/>

    <!-- Dot circle guide -->
    <circle cx="232" cy="60" r="18" stroke-dasharray="4 3"/>

    <!-- Speech tail triangle -->
    <polygon points="88,240 38,254 52,204" stroke-dasharray="4 3" stroke="#d4b8a8"/>

    <!-- Center of bubble square crosshairs -->
    <line x1="140" y1="140" x2="164" y2="140" stroke-dasharray="3 2"/>
    <line x1="152" y1="128" x2="152" y2="152" stroke-dasharray="3 2"/>

    <!-- Baton midpoint marker -->
    <circle cx="154" cy="138" r="3" fill="#cc785c" fill-opacity="0.5" stroke="none"/>

    <!-- Corner arc center markers -->
    <circle cx="88" cy="76" r="2" fill="#c0bdb8" stroke="none"/>
    <circle cx="216" cy="76" r="2" fill="#c0bdb8" stroke="none"/>
    <circle cx="216" cy="204" r="2" fill="#c0bdb8" stroke="none"/>
    <circle cx="88" cy="204" r="2" fill="#c0bdb8" stroke="none"/>
  </g>

  <!-- ─── Icon (drawn over guides) ─── -->
  <!-- Using transform="translate(24,24) scale(2)" on 128-unit mark paths -->
  <g transform="translate(24,24) scale(2)">
    <defs>
      <clipPath id="bubble-clip-cg">
        <path d="M 32,8 H 96 a 18,18 0 0 1 18,18 V 90 a 18,18 0 0 1 -18,18 H 32 L 7,115 L 14,90 V 26 a 18,18 0 0 1 18,-18 Z"/>
      </clipPath>
    </defs>
    <g clip-path="url(#bubble-clip-cg)">
      <line x1="26" y1="96" x2="104" y2="18" stroke="#cc785c" stroke-width="12" stroke-linecap="butt"/>
      <circle cx="104" cy="18" r="9" fill="#cc785c"/>
    </g>
    <path d="M 32,8 H 96 a 18,18 0 0 1 18,18 V 90 a 18,18 0 0 1 -18,18 H 32 L 7,115 L 14,90 V 26 a 18,18 0 0 1 18,-18 Z"
      fill="none" stroke="#1f1e1c" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- ─── Dimension annotations ─── -->
  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="9" fill="#9b9490">
    <!-- "r=18" at TL corner -->
    <text x="57" y="56">r=18</text>
    <!-- "45°" label at baton midpoint -->
    <text x="158" y="135" fill="#cc785c">45°</text>
    <!-- "dot r=9" at top-right -->
    <text x="234" y="55">r=9</text>
  </g>

  <!-- ─── Caption ─── -->
  <line x1="24" y1="272" x2="256" y2="272" stroke="#e8e4dc" stroke-width="1"/>

  <g font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', monospace" font-size="10.5" fill="#4a4540" letter-spacing="0">
    <text x="24" y="292" font-weight="600" fill="#2a2925">Concerto mark — geometric decisions</text>
    <text x="24" y="310">Viewbox: 128×128 · Square: 100px side at (14,8)</text>
    <text x="24" y="326">Corner radius: 18% of side = 18px (18px/100px)</text>
    <text x="24" y="342">Speech tail: equilateral Δ from BL arc endpoints, tip=(7,115)</text>
    <text x="24" y="358">Baton: 45° diagonal (26,96)→(104,18), dx=dy=78px</text>
    <text x="24" y="374">Baton stroke: 12% of side = 12px · Dot: r=9px (9% of side)</text>
    <text x="24" y="390" fill="#9b9490">2026-05-17 · peach baton #cc785c · bubble #faf9f5/dark · bg #1f1e1c</text>
  </g>
</svg>
