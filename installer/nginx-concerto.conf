# Copied from the DO cloud_init nginx config which works end-to-end with
# Claude.ai. The key insight: Claude.ai needs to reach the MCP server's
# OAuth endpoints (/.well-known/*, /authorize, /register, /token), AND
# the server must advertise https:// URLs in its OAuth metadata.
#
# Using $scheme made the MCP server advertise http:// OAuth endpoints,
# which caused Claude.ai to fail with "Authorization with the MCP server
# failed". We trust X-Forwarded-Proto from cloudflared/the edge; default
# to https because the public URL is always https.
map $http_x_forwarded_proto $concerto_fwd_proto {
    default   $http_x_forwarded_proto;
    ""        https;
}

server {
    listen 8080;
    server_name _;

    # Health check — explicit no-auth, for external monitoring.
    location = /healthz {
        proxy_pass http://127.0.0.1:9876/healthz;
        proxy_set_header Host $host;
        proxy_read_timeout 10;
        proxy_send_timeout 10;
    }

    # MCP server (all non-terminal traffic): /mcp, /.well-known/*, /authorize,
    # /register, /token, /__internal/*, everything else. Same pattern as DO.
    location / {
        proxy_pass         http://127.0.0.1:9876;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $concerto_fwd_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # One-click data export downloads (export_my_work tool writes here).
    location /download/ {
        alias /var/concerto-exports/;
        add_header Content-Disposition "attachment";
        autoindex off;
    }
}
