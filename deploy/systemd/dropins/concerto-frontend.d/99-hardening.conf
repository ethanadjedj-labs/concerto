# concerto-frontend hardening drop-in — applied to concerto-frontend.service
#
# Service: concerto-frontend (Next.js via `npx next start -p 3500`, port 3500)
# WorkingDirectory: /opt/concerto-frontend  Runs as: root
# Notes: npx needs its cache already warm (/root/.npm is NOT accessible with
#        ProtectHome=yes — cold-start must use locally-cached node_modules).
#
# DEPLOY SAFETY: After changing this file, run deploy.sh — it applies the
# drop-in, daemon-reloads, restarts both services, and runs the full e2e
# smoke-test. Do NOT edit /etc/systemd directly without going through deploy.sh.
#
# ── WHY EACH NON-OBVIOUS SETTING IS HERE ─────────────────────────────────────
#
# MemoryDenyWriteExecute  ← MUST STAY DISABLED (commented out below)
#   Node.js/V8 requires the ability to allocate executable pages for its JIT
#   baseline compiler (Maglev/Turbofan). With MDWE=yes, the kernel rejects the
#   mprotect(PROT_EXEC) call at process startup with ENOMEM (errno 12).
#   Symptom: `next start` crashes immediately at "v8::base::OS::SetPermissions",
#   the service enters a crash-loop (seen 13 restarts on 2026-06-03), and all
#   frontend routes return 502. This took concerto.run fully down.
#   All other hardening settings in this file remain active.
#
# ProtectSystem=strict / ReadWritePaths
#   Makes filesystem read-only except the listed paths.
#   /opt/concerto-frontend — Next.js writes .next/ cache and build artifacts.
#   /opt/concerto          — shared config/static assets read by the frontend.
#   /var/log/empire  /var/lib/empire — shared log/state dirs.
#
# ProtectHome=yes
#   Hides /root /home. npx must NOT need to download next-server at runtime
#   (cold-start download to /root/.npm would fail silently). Ensure next is
#   pre-installed in node_modules before deploying.
#
# RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
#   Frontend serves HTTP on :3500, uses AF_UNIX for Node IPC, netlink for DNS.
#
# SystemCallFilter=@system-service / SystemCallErrorNumber=EPERM
#   Allows only syscalls for a typical server process; returns EPERM on
#   violations (not SIGSYS) for easier diagnosis.
# ─────────────────────────────────────────────────────────────────────────────

[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
# MemoryDenyWriteExecute=yes  — DISABLED: V8 JIT in Node.js requires W^X mmap
# to allocate executable pages for the baseline compiler (Maglev/Turbofan).
# With this enabled, `next start` crashes at v8::base::OS::SetPermissions with
# errno 12 (ENOMEM) and enters a crash-loop. Outage confirmed 2026-06-03.
# All other hardening settings above remain in place.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
KeyringMode=private

ReadWritePaths=/var/log/empire /var/lib/empire /opt/concerto-frontend /opt/concerto
