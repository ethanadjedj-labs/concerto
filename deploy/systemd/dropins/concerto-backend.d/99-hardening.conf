# concerto-backend hardening drop-in — applied to concerto-backend.service
#
# Service: concerto-backend (uvicorn on :8090, FastAPI)
# WorkingDirectory: /opt/concerto/backend  Runs as: root
# Reads:  /etc/empire/env (EnvironmentFile)
# Writes: /opt/concerto  /var/log/empire  /var/lib/empire  /var/lib/concerto
#
# DEPLOY SAFETY: After changing this file, run deploy.sh — it applies the
# drop-in, daemon-reloads, restarts both services, and runs the full e2e
# smoke-test. Do NOT edit /etc/systemd directly without going through deploy.sh.
#
# ── WHY EACH NON-OBVIOUS SETTING IS HERE ─────────────────────────────────────
#
# ProtectSystem=strict
#   Makes entire filesystem read-only except explicit ReadWritePaths.
#   Required to prevent a compromised backend from writing to system paths.
#
# ReadWritePaths includes /var/lib/concerto  ← MUST NOT REMOVE
#   SQLite DB lives at /var/lib/concerto/concerto.db. Without this path,
#   systemd makes the directory read-only at service startup, and uvicorn
#   crashes with "sqlite3.OperationalError: unable to open database file"
#   (errno EROFS). This was the root cause of the 2026-06-03 outage
#   (site down ~minutes, all routes 502). Never remove this path.
#
# MemoryDenyWriteExecute=yes  — safe ON for the backend
#   Python/uvicorn does not use W^X mmap for JIT compilation. This is
#   appropriate hardening for the backend process.
#   WARNING: This is NOT safe for the frontend (Next.js/Node) — see
#   concerto-frontend.d/99-hardening.conf for why it is disabled there.
#
# ProtectHome=yes
#   Hides /root /home. Backend has no legitimate need to access home dirs.
#
# PrivateTmp=yes
#   Isolates /tmp per-service, prevents /tmp-based cross-service attacks.
#
# RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
#   Backend uses TCP (HTTP on :8090), Unix sockets (internal), netlink (DNS).
#   No raw sockets, no packet sockets needed.
#
# SystemCallFilter=@system-service / SystemCallErrorNumber=EPERM
#   Allows only syscalls for a typical server process; returns EPERM (not
#   SIGSYS) for disallowed calls — easier to diagnose than a signal crash.
# ─────────────────────────────────────────────────────────────────────────────

[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
KeyringMode=private

ReadWritePaths=/var/log/empire /var/lib/empire /var/lib/concerto /opt/concerto /opt/empire
